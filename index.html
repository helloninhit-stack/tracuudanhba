var CHIPS = ['Hợp đồng lao động', 'Bảo hiểm xe', 'Lương, bảo hiểm', 'Tuyển dụng', 'Chấm công, nghỉ phép', 'Đơn hàng', 'Công văn', 'Nén mẫu', 'Cấp phối', 'Điều phối xe', 'Mật khẩu, mạng', 'Hồ sơ thanh toán'];
var STOP = ['ai', 'lo', 'la', 'trach', 've', 'cho', 'can', 'lien', 'he', 'voi', 'nguoi', 'dau', 'moi', 'nao', 'cua', 'xin', 'hoi', 'toi', 'minh', 'muon', 'tim', 'o', 'the', 'va', 'hay'];

function norm(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g).replace(/đ/g, 'd').replace(/[^a-z0-9]+/g, ' ').trim();
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
}
function fmt(p) { return p.replace(/^(\d{4})(\d{3})(\d{3})$/, '$1 $2 $3'); }
function hasWord(text, tok) { return (' ' + text).indexOf(' ' + tok) !== -1; }

var ALL = [];
DEPTS.forEach(function (d) {
  d.entries.forEach(function (e) {
    e.dept = d;
    e.nTasks = e.tasks.map(norm);
    e.nPeople = norm(e.contacts.filter(function (c) { return !c.vacant; }).map(function (c) { return c.name; }).join(' '));
    e.nOther = norm(d.name + ' ' + e.contacts.map(function (c) { return c.role; }).join(' '));
    ALL.push(e);
  });
});

function tokens(raw) {
  var q = norm(raw).replace(/\bphu trach\b/g, ' ');
  return q.split(' ').filter(function (t) { return t && STOP.indexOf(t) === -1; });
}

function scoreEntry(e, toks) {
  var phrase = toks.join(' ');
  var score = 0, hits = 0, miss = 0, matched = {};
  e.nTasks.forEach(function (t, i) {
    if (hasWord(t, phrase)) { score += 100; matched[i] = 1; }
  });
  toks.forEach(function (tok) {
    var found = false;
    e.nTasks.forEach(function (t, i) {
      if (hasWord(t, tok)) { matched[i] = 1; if (!found) { score += 10; } found = true; }
    });
    if (hasWord(e.nPeople, tok)) { score += 5; found = true; }
    if (hasWord(e.nOther, tok)) { score += 3; found = true; }
    if (found) { hits++; } else { miss++; }
  });
  if (!e.head) { score += 5; }
  return { e: e, score: score, hits: hits, miss: miss, matched: matched };
}

function search(raw) {
  var toks = tokens(raw);
  if (!toks.length) { return { mode: raw.trim() ? 'none' : 'all', items: [] }; }
  var scored = ALL.map(function (e, i) { var r = scoreEntry(e, toks); r.i = i; return r; });
  var sortFn = function (a, b) { return b.score - a.score || a.i - b.i; };
  var exact = scored.filter(function (r) { return r.miss === 0; }).sort(sortFn);
  var phrased = exact.filter(function (r) { return r.score >= 100; });
  if (phrased.length) { return { mode: 'exact', items: phrased }; }
  if (exact.length) { return { mode: 'exact', items: exact }; }
  var near = scored.filter(function (r) { return r.hits > 0; }).sort(sortFn);
  return { mode: near.length ? 'near' : 'none', items: near };
}

function fallback(e) {
  var head = e.dept.entries.filter(function (x) { return x.head && x !== e; })[0];
  if (head) {
    var h = head.contacts[0];
    return '<p class="fb"><span>Tạm thời liên hệ trưởng bộ phận: <b>' + esc(h.name) + '</b></span></p>';
  }
  return '<p class="fb">Liên hệ văn phòng điều hành để được hướng dẫn.</p>';
}

function contactHtml(c, e) {
  var name = c.name || 'Chưa ghi tên người nhận';
  var s = '<div class="ct"><p class="who"><strong>' + esc(name) + '</strong>' + (c.role ? '<span>' + esc(c.role) + '</span>' : '') + '</p>';
  if (c.vacant) { s += fallback(e); }
  return s + '</div>';
}

function itemHtml(e, matched, showDept) {
  var rows = e.tasks.map(function (t, i) {
    return '<li' + (matched && matched[i] ? ' class="hit"' : '') + '>' + esc(t) + '</li>';
  }).join('');
  return '<li class="item"><div class="main">' +
    (showDept ? '<p class="meta">' + esc(e.dept.name) + '</p>' : '') +
    '<ul class="tasks" aria-label="Đầu việc">' + rows + '</ul></div>' +
    '<div class="call">' + e.contacts.map(function (c) { return contactHtml(c, e); }).join('') + '</div></li>';
}

var qEl = document.getElementById('q');
var outEl = document.getElementById('out');
var statusEl = document.getElementById('status');

function render() {
  var raw = qEl.value;
  var r = search(raw);
  if (r.mode === 'all') {
    statusEl.textContent = 'Toàn bộ danh bạ, ' + ALL.length + ' đầu mối. Gõ vào ô trên để lọc theo việc.';
    outEl.innerHTML = DEPTS.map(function (d) {
      return '<h2 class="dept">' + esc(d.name) + '</h2><ul class="panel">' +
        d.entries.map(function (e) { return itemHtml(e, null, false); }).join('') + '</ul>';
    }).join('');
    return;
  }
  if (r.mode === 'none') {
    statusEl.innerHTML = 'Không tìm thấy đầu mối cho “<b>' + esc(raw.trim()) + '</b>”.';
    outEl.innerHTML = '<div class="panel empty"><p>Thử gõ ngắn hơn, ví dụ “hợp đồng”, “xe”, “lương”, hoặc chọn một mục ở phần “Hay tìm”.</p><p class="none">Nếu vẫn chưa rõ, liên hệ trưởng bộ phận hoặc văn phòng điều hành.</p></div>';
    return;
  }
  statusEl.innerHTML = (r.mode === 'near' ? 'Không có kết quả khớp hoàn toàn. ' : '') +
    '<b>' + r.items.length + '</b> đầu mối ' + (r.mode === 'near' ? 'gần đúng' : 'cho') + ' “<b>' + esc(raw.trim()) + '</b>”';
  outEl.innerHTML = '<ul class="panel">' + r.items.map(function (x) { return itemHtml(x.e, x.matched, true); }).join('') + '</ul>';
}

document.getElementById('chips').innerHTML = CHIPS.map(function (c) {
  return '<li><button type="button" class="chip" data-q="' + esc(c) + '">' + esc(c) + '</button></li>';
}).join('');

qEl.addEventListener('input', render);
document.addEventListener('click', function (ev) {
  var chip = ev.target.closest ? ev.target.closest('.chip') : null;
  if (chip) { qEl.value = chip.getAttribute('data-q'); render(); window.scrollTo(0, 0); }
});

render();
</script>

</body></html>
